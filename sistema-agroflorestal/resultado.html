<!doctype html>
<!-- resultado.html é a estrutura da tela de resposta. resultado.js monta o conteúdo
     usando a análise guardada no navegador e os arquivos de dados do site. -->
<html lang="pt-BR">
  <head>
    <!-- Configura acentos e a largura em dispositivos móveis. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Apresentação em buscas e cor de interface em navegadores que aceitam theme-color. -->
    <meta
      name="description"
      content="Projeto de apoio ao trabalho da equipe na FIRST LEGO League sobre sistemas agroflorestais, com propostas ilustrativas e regras transparentes."
    />
    <meta name="theme-color" content="#26533E" />
    <!-- Título da aba; o arquivo SVG logo abaixo fornece o ícone da página. -->
    <title>Propostas agroflorestais — ybyrá</title>
    <link rel="icon" href="assets/marca/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="assets/marca/favicon-32.png?v=2" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/marca/favicon-16.png?v=2" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="assets/marca/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="assets/marca/apple-touch-icon.png?v=2" sizes="180x180" />
    <link rel="manifest" href="assets/marca/site.webmanifest" />
    <!-- O CSS da resposta complementa o global com cartões, estratos, fases e abas. -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/resultado.css" />
    <link rel="stylesheet" href="css/crescimento.css" />
    <link rel="stylesheet" href="css/orientacao.css" />
    <link rel="stylesheet" href="css/ecologico.css" />
    <!-- Esse módulo calcula e apresenta a resposta depois de o documento ser lido. -->
    <script type="module" src="js/resultado.js"></script>
    <link rel="stylesheet" href="css/experiencia.css" />
    <script type="module" src="js/interacoes.js"></script>
    <link rel="stylesheet" href="css/navegacao.css" />
    <link rel="stylesheet" href="css/rodape.css" />
  </head>
  <body>
    <!-- Atalho para chegar ao conteúdo com teclado, sem passar por todos os links do menu. -->
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <!-- Cabeçalho compartilhado: a folha é um desenho SVG e href indica o destino dos links. -->
    <header class="cabecalho">
      <div class="container cabecalho-interno">
        <a class="marca" href="index.html"
          ><img
            class="marca-logo"
            src="assets/marca/logo-negativa.svg?v=2"
            alt="ybyrá — Sistema agroflorestal"
            width="180"
            height="95"
        /></a>
        <nav aria-label="Navegação principal">
          <a href="index.html">Início</a><a href="analise.html">Criar SAF</a
          ><a href="especies.html">Plantas</a><a href="historia.html">Sobre</a>
        </nav>
        <div class="cabecalho-ferramentas">
          <button class="ajuda-cabecalho" type="button" data-abrir-guia>Como usar</button
          ><a class="conta-atalho" href="conta.html"
            ><span>Entrar</span></a
          >
        </div>
      </div>
    </header>
    <main class="container" id="conteudo">
      <!-- Esta página não consegue produzir propostas sem JavaScript. -->
      <noscript>
        <p class="erro">Ative o JavaScript para carregar o catálogo, os cenários e as análises.</p>
      </noscript>
      <div class="pagina-titulo">
        <!-- ?editar é lido por analise.js para recuperar os dados em vez de começar vazio. -->
        <a class="voltar" href="analise.html?editar">← Análise</a>
        <h1>Explore suas propostas de SAF.</h1>
        <p>Compare combinações de plantas e veja como cada proposta se organiza.</p>
      </div>
      <!-- Erros começam ocultos; o JS mostra a mensagem se faltar arquivo ou houver falha. -->
      <p id="erro" class="erro" role="alert" tabindex="-1" hidden></p>
      <!-- Destino do resumo, diagnóstico e propostas criados por resultado.js.
                 aria-live polite sinaliza mudanças de conteúdo sem interromper a leitura atual. -->
      <div id="resultado">
        <p>Preparando a composição…</p>
      </div>
    </main>
    <!-- Metodologia e fontes continuam acessíveis após a exploração do resultado. -->
    <!-- rodape-compartilhado -->
  </body>
</html>
